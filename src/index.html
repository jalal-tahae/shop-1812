<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shop</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header
      class="sticky top-0 z-50 border-b border-gray-200 bg-white/95 backdrop-blur"
    >
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-20 items-center justify-between">
          <!-- Logo -->
          <a href="/" class="flex items-center gap-3 shrink-0">
            <div
              class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-lg font-bold text-white shadow-sm"
            >
              L
            </div>

            <span class="text-xl font-extrabold text-gray-900"> لوگو </span>
          </a>

          <!-- Desktop Navigation -->
          <nav class="hidden items-center gap-8 lg:flex">
            <a
              onclick="handleAClick(event)"
              href="/products"
              class="text-sm font-medium text-gray-700 transition hover:text-blue-600"
            >
              همه محصولات
            </a>

            <a
              onclick="handleAClick(event)"
              href="/about"
              class="text-sm font-medium text-gray-700 transition hover:text-blue-600"
            >
              درباره ما
            </a>

            <a
              href="/cart"
              onclick="handleAClick(event)"
              class="text-sm font-medium text-gray-700 transition hover:text-blue-600"
            >
              سبد خرید
            </a>
          </nav>

          <!-- Desktop Auth -->
          <div class="hidden items-center gap-3 lg:flex" id="auth-container">
            <a
              onclick="handleAClick(event)"
              href="/login"
              class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 hover:text-blue-600"
            >
              ورود
            </a>

            <a
              href="/register"
              class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
            >
              ثبت نام
            </a>
          </div>

          <!-- Mobile Menu Button -->
          <button
            id="menuButton"
            type="button"
            aria-label="باز کردن منو"
            aria-expanded="false"
            class="flex h-10 w-10 items-center justify-center rounded-lg text-gray-700 transition hover:bg-gray-100 lg:hidden"
          >
            <!-- Hamburger -->
            <svg
              id="menuIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>

            <!-- Close -->
            <svg
              id="closeIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="hidden h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Mobile Menu -->
        <div
          id="mobileMenu"
          class="hidden border-t border-gray-100 py-4 lg:hidden"
        >
          <nav class="flex flex-col gap-1">
            <a
              onclick="handleAClick(event)"
              href="/products"
              class="rounded-lg px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50 hover:text-blue-600"
            >
              همه محصولات
            </a>

            <a
              onclick="handleAClick(event)"
              href="/about"
              class="rounded-lg px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50 hover:text-blue-600"
            >
              درباره ما
            </a>

            <a
              href="/contact"
              class="rounded-lg px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50 hover:text-blue-600"
            >
              ارتباط با ما
            </a>

            <!-- Mobile Auth -->
            <div
              class="mt-3 grid grid-cols-2 gap-3 border-t border-gray-100 pt-4"
            >
              <a
                onclick="handleAClick(event)"
                href="/login"
                class="rounded-lg border border-gray-200 px-4 py-3 text-center text-sm font-medium text-gray-700 transition hover:bg-gray-50"
              >
                ورود
              </a>

              <a
                href="/register"
                class="rounded-lg bg-blue-600 px-4 py-3 text-center text-sm font-semibold text-white transition hover:bg-blue-700"
              >
                ثبت نام
              </a>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <div id="root"></div>

    <script
      type="text/javascript"
      src="/node_modules/toastify-js/src/toastify.js"
    ></script>
  </body>
</html>
